name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🍎 选择 Xcode 26.3 (Swift 6.3)
        run: |
          for xcode in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.app; do
            if [ -d "$xcode" ]; then
              echo "切换到: $xcode"
              sudo xcode-select -switch "$xcode"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: 🔧 修复 Expo Swift 兼容性与并发模式
        run: python3 scripts/patch-ios-expo.py

      - name: ⚙️ 生成 iOS 原生工程与 CocoaPods 依赖
        run: npx expo prebuild --platform ios --clean

      - name: 🔧 配置 Xcode 与 Pods 允许非模块化头文件与免签
        run: |
          python3 scripts/patch-ios-expo.py
          # 使用 Ruby xcodeproj 将 Pods 和 App 工程全局开启非模块化包含与免签
          ruby -r xcodeproj -e '
            ["ios/Pods/Pods.xcodeproj", "ios/app.xcodeproj"].each do |proj_path|
              next unless File.exist?(proj_path)
              project = Xcodeproj::Project.open(proj_path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["SWIFT_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                  config.build_settings["GCC_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                end
              end
              project.save
              puts "Configured settings for #{proj_path}"
            end
          '

      - name: 🔨 编译 iOS 项目并生成 IPA
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "未找到 xcworkspace，退出"
            exit 1
          fi
          echo "检测到 Workspace: $WORKSPACE"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          # 执行 ad-hoc 自签名以兼容 TrollStore / Sideloadly / AltStore 提取器
          codesign --force --deep --sign - Payload/*.app || true
          zip -qr ../password-vault.ipa Payload
          cd ..
          ls -lh password-vault.ipa

      - name: 📤 上传 IPA 到 GitHub Actions 构件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: password-vault-ios-ipa
          path: password-vault.ipa
          retention-days: 30

      - name: 🚀 自动上传 IPA 到 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          files: password-vault.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
