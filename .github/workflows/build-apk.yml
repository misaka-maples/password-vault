name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: ⚙️ 生成 Android 原生工程 (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 编译 Release APK (针对主流 64位 ARM 手机极速瘦身)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 📋 整理构建产物
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/password-vault.apk
          ls -lh build-output/password-vault.apk

      - name: 📤 上传 APK 到 GitHub Actions 构件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: password-vault-apk
          path: build-output/password-vault.apk
          retention-days: 30

      - name: ☁️ 上传 APK 和 latest.json 到腾讯 COS
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          COSCLI_VERSION="1.0.9"
          curl -fsSL \
            "https://github.com/tencentyun/coscli/releases/download/v${COSCLI_VERSION}/coscli-v${COSCLI_VERSION}-linux-amd64" \
            -o /tmp/coscli
          chmod +x /tmp/coscli

          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode || 1")
          FILE_SIZE=$(ls -lh build-output/password-vault.apk | awk '{print $5}')
          APK_OBJECT="releases/v${VERSION}/password-vault.apk"
          DOWNLOAD_URL="${COS_PUBLIC_BASE_URL%/}/${APK_OBJECT}"

          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg title "v${VERSION} 新版本" \
            --arg releaseNotes "优化体验与修复已知问题" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg fileSize "$FILE_SIZE" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{version:$version,versionCode:$versionCode,title:$title,releaseNotes:$releaseNotes,downloadUrl:$downloadUrl,fileSize:$fileSize,forceUpdate:false,publishedAt:$publishedAt}' \
            > build-output/latest.json

          COS_ARGS=(
            --init-skip
            --secret-id "$COS_SECRET_ID"
            --secret-key "$COS_SECRET_KEY"
            --endpoint "cos.${COS_REGION}.myqcloud.com"
          )

          /tmp/coscli cp build-output/password-vault.apk "cos://${COS_BUCKET}/${APK_OBJECT}" "${COS_ARGS[@]}"
          /tmp/coscli cp build-output/latest.json "cos://${COS_BUCKET}/releases/latest.json" "${COS_ARGS[@]}"

          echo "已发布 APK: ${DOWNLOAD_URL}"
          echo "版本清单: ${COS_PUBLIC_BASE_URL%/}/releases/latest.json"

      - name: 🚀 自动创建或更新 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/password-vault.apk
          name: 密码保险库 ${{ github.ref_name }}
          body: |
            ## 📱 密码保险库 ${{ github.ref_name }} 发布 (国内腾讯云加速版)

            * 腾讯云国内直连下载: ${{ secrets.COS_PUBLIC_BASE_URL }}/releases/${{ github.ref_name }}/password-vault.apk
            * GitHub Release 下载: 直接下载下方 password-vault.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
