name: Build App (Android APK & iOS IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: ⚙️ 生成 Android 原生工程 (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 编译 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 整理构建产物
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/password-vault.apk

      - name: 📤 上传 APK 到 GitHub Actions 构件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: password-vault-apk
          path: build-output/password-vault.apk
          retention-days: 30

      - name: 🚀 自动创建或补充 GitHub Release (打 tag 时自动发布)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/password-vault.apk
          name: 密码保险库 ${{ github.ref_name }}
          body: |
            ## 📱 密码保险库 ${{ github.ref_name }} 发布

            ### 📥 下载安装
            * **Android**: 下载下方 `password-vault.apk` 直接安装。
            * **iOS**: 下载下方 `password-vault.ipa`，可使用爱思助手/Sideloadly/AltStore/牛蛙助手进行免费自签侧载，或通过 TrollStore (巨魔商店) 免签安装。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ☁️ 自动同步新版本至 Supabase 发版表
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode || 1")
          # 使用国内高速加速镜像前缀，确保国内手机移动蜂窝网也能极速一键在线下载
          DOWNLOAD_URL="https://gh-proxy.com/https://github.com/misaka-maples/password-vault/releases/download/${GITHUB_REF_NAME}/password-vault.apk"
          echo "正在自动将版本 $VERSION (code: $VERSION_CODE) 同步至 Supabase: $DOWNLOAD_URL"
          curl -s -X POST "https://xgalwvshlamuihtxjsfd.supabase.co/rest/v1/app_releases" \
            -H "apikey: sb_publishable_oNqwiQN2TADE4RCLTtEcyw_cGGLHzF5" \
            -H "Authorization: Bearer sb_publishable_oNqwiQN2TADE4RCLTtEcyw_cGGLHzF5" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version\": \"${VERSION}\",
              \"version_code\": ${VERSION_CODE},
              \"title\": \"v${VERSION} 体验优化与更新\",
              \"release_notes\": \"1. 统一插画拟物风主题弹窗；\n2. 修复更新下载取消按钮显示；\n3. 接入高速下载节点，免翻墙直接在线升级。\",
              \"download_url\": \"${DOWNLOAD_URL}\",
              \"file_size\": \"65 MB\"
            }" || true

  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🍎 选择 Xcode 16.1+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: ⚙️ 生成 iOS 原生工程与 CocoaPods 依赖
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 编译 iOS 项目并生成 IPA
        run: |
          cd ios
          xcodebuild -workspace app.xcworkspace \
            -scheme app \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # 封装为标准 iOS IPA (Payload 结构)
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr ../password-vault.ipa Payload
          cd ..

      - name: 📤 上传 IPA 到 GitHub Actions 构件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: password-vault-ios-ipa
          path: password-vault.ipa
          retention-days: 30

      - name: 🚀 自动上传 IPA 到 GitHub Release (打 tag 时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: password-vault.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
