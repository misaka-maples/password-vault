name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: ⚙️ 生成 Android 原生工程 (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 编译 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 整理构建产物
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/password-vault.apk

      - name: 📤 上传 APK 到 GitHub Actions 构件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: password-vault-apk
          path: build-output/password-vault.apk
          retention-days: 30

      - name: 🚀 自动创建 GitHub Release (打 tag 时自动发布)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/password-vault.apk
          name: 密码保险库 ${{ github.ref_name }}
          body: |
            ## 📱 密码保险库 ${{ github.ref_name }} 发布

            ### 📥 下载安装
            直接下载下方的 `password-vault.apk` 即可在 Android 手机上安装使用。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ☁️ 自动同步新版本至 Supabase 发版表
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode || 1")
          # 使用国内高速加速镜像前缀，确保国内手机移动蜂窝网也能极速一键在线下载
          DOWNLOAD_URL="https://gh-proxy.com/https://github.com/misaka-maples/password-vault/releases/download/${GITHUB_REF_NAME}/password-vault.apk"
          echo "正在自动将版本 $VERSION (code: $VERSION_CODE) 同步至 Supabase: $DOWNLOAD_URL"
          curl -s -X POST "https://xgalwvshlamuihtxjsfd.supabase.co/rest/v1/app_releases" \
            -H "apikey: sb_publishable_oNqwiQN2TADE4RCLTtEcyw_cGGLHzF5" \
            -H "Authorization: Bearer sb_publishable_oNqwiQN2TADE4RCLTtEcyw_cGGLHzF5" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version\": \"${VERSION}\",
              \"version_code\": ${VERSION_CODE},
              \"title\": \"v${VERSION} 体验优化与更新\",
              \"release_notes\": \"1. 统一插画拟物风主题弹窗；\n2. 修复更新下载取消按钮显示；\n3. 接入高速下载节点，免翻墙直接在线升级。\",
              \"download_url\": \"${DOWNLOAD_URL}\",
              \"file_size\": \"65 MB\"
            }" || true
