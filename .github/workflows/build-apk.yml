name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm ci

      - name: ⚙️ 生成 Android 原生工程 (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 编译 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 整理构建产物
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/密码保险库.apk

      - name: 📤 上传 APK 到 GitHub Actions 构件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 密码保险库-apk
          path: build-output/密码保险库.apk
          retention-days: 30

      - name: 🚀 自动创建 GitHub Release (打 tag 时自动发布)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/密码保险库.apk
          name: 密码保险库 ${{ github.ref_name }}
          body: |
            ## 📱 密码保险库 ${{ github.ref_name }} 发布

            ### 📥 下载安装
            直接下载下方的 `密码保险库.apk` 即可在 Android 手机上安装使用。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
